<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />

    <title>Ford Explorer Blog | Johnson Sewell Ford</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      .explorer-blog-wrapper {
        width: 100%;
        max-width: 1200px;
        margin: 50px auto;
        padding: 0 20px;
      }

      .explorer-blog-header {
        margin-bottom: 30px;
      }

      .explorer-blog-header h2 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.2;
        font-weight: 700;
      }

      .explorer-blog-header p {
        margin: 0;
        color: #666;
        font-size: 17px;
      }

      /*
         * FEATURED BLOG
         */

      .latest-explorer-blog {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 45px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      }

      .latest-explorer-image {
        min-height: 360px;
        background-size: cover;
        background-position: center;
        background-color: #ddd;
      }

      .latest-explorer-content {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .blog-category {
        display: inline-block;
        margin-bottom: 12px;
        color: #0067b1;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .latest-explorer-content h3 {
        margin: 0 0 15px;
        font-size: 30px;
        line-height: 1.2;
      }

      .blog-date {
        color: #777;
        font-size: 14px;
        margin-bottom: 18px;
      }

      .blog-excerpt {
        color: #555;

        margin-bottom: 25px;
      }

      .blog-button {
        display: inline-block;
        width: fit-content;
        padding: 13px 22px;
        background: #0067b1;
        color: #fff;

      }

      .blog-button:hover {
        background: #004f87;

      /*

      .recent-explorer-title {
        margin-bottom: 20px;

      .recent-explorer-title h3 {
        margin: 0;

      /*

         */

      @media (max-width: 900px) {
        .latest-explorer-blog {
          grid-template-columns: 1fr;

        .latest-explorer-image {
          min-height: 280px;
        }

        .recent-explorer-blogs {
          grid-template-columns: 1fr 1fr;

      @media (max-width: 600px) {

          margin: 30px auto;

        .explorer-blog-header h2 {
          font-size: 28px;

        .latest-explorer-content {
          padding: 25px;

          font-size: 24px;

        .recent-explorer-blogs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="explorer-blog-wrapper">
      <div class="explorer-blog-header">
        <h2>Ford Explorer Blog</h2>
        <p>The latest Ford Explorer news, research, comparisons and buying information.</p>
      </div>

      <div id="explorerBlogFeed">
        <div class="blog-loading">Loading Ford Explorer blogs...</div>
      </div>
    </div>

    <script>
      /*
       * ---------------------------------------------------------
       * CONFIGURATION
       * ---------------------------------------------------------
       */

      const BLOG_SOURCE = "/api/johnsonsewell-blog";

      const BLOG_URL = "https://www.johnsonsewell.com/blog";

      const EXPLORER_CATEGORY = "ford explorer";

      /*
       * ---------------------------------------------------------
       * LOAD BLOG PAGE
       * ---------------------------------------------------------
       */

      async function loadExplorerBlogs() {
        const container = document.getElementById("explorerBlogFeed");

        try {
          const response = await fetch(BLOG_SOURCE);

          if (!response.ok) {
            throw new Error("Unable to retrieve blog content.");
          }

          const html = await response.text();

          const posts = parseBlogPosts(html);

          /*
           * Filter specifically for Ford Explorer
           */

          const explorerPosts = posts
            .filter((post) => {
              const category = (post.category || "").toLowerCase();

              const title = (post.title || "").toLowerCase();

              const content = (post.description || "").toLowerCase();

              return category.includes(EXPLORER_CATEGORY) || title.includes("ford explorer") || content.includes("ford explorer");
            })
            .sort((a, b) => {
              return new Date(b.date) - new Date(a.date);
            });

          if (!explorerPosts.length) {
            container.innerHTML = `
                    <div class="blog-error">
                        No Ford Explorer blogs were found.
                    </div>
                `;

            return;
          }

          /*
           * First post = Featured Blog
           */

          const latestBlog = explorerPosts[0];

          /*
           * Next 3 posts = Recent Blogs
           */

          const recentBlogs = explorerPosts.slice(1, 4);

          renderBlogs(latestBlog, recentBlogs);
        } catch (error) {
          console.error("Explorer blog error:", error);

          container.innerHTML = `
                <div class="blog-error">
                    We were unable to load the latest Ford Explorer blogs.
                </div>
            `;
        }
      }

      /*
       * ---------------------------------------------------------
       * PARSE BLOG HTML
       * ---------------------------------------------------------
       *
       * These selectors should be adjusted if the Johnson Sewell
       * blog template changes.
       */

      function parseBlogPosts(html) {
        const parser = new DOMParser();

        const documentHTML = parser.parseFromString(html, "text/html");

        /*
         * Blog articles
         */

        const articles = documentHTML.querySelectorAll("article, .blog-post, .blog-item, .post");

        const posts = [];

        articles.forEach((article) => {
          const titleElement = article.querySelector("h1, h2, h3, h4, .title, .post-title");

          const linkElement = article.querySelector("a[href]");

          const imageElement = article.querySelector("img");

          const dateElement = article.querySelector("time, .date, .post-date");

          const categoryElement = article.querySelector(".category, .post-category, .blog-category");

          const descriptionElement = article.querySelector(".excerpt, .description, .summary, p");

          if (!titleElement) {
            return;
          }

          const title = titleElement.textContent.trim();

          const url = linkElement ? new URL(linkElement.getAttribute("href"), BLOG_URL).href : BLOG_URL;

          const image = imageElement ? new URL(imageElement.getAttribute("src"), BLOG_URL).href : "";

          const date = dateElement ? dateElement.getAttribute("datetime") || dateElement.textContent.trim() : "";

          const category = categoryElement ? categoryElement.textContent.trim() : "";

          const description = descriptionElement ? descriptionElement.textContent.trim() : "";

          posts.push({
            title: title,

            url: url,

            image: image,

            date: date,

            category: category,

            description: description,
          });
        });

        return posts;
      }

      /*
       * ---------------------------------------------------------
       * RENDER BLOGS
       * ---------------------------------------------------------
       */

      function renderBlogs(latestBlog, recentBlogs) {
        const container = document.getElementById("explorerBlogFeed");

        /*
         * Featured blog
         */

        let html = `

            <section class="latest-explorer-blog">

                <div
                    class="latest-explorer-image"
                    style="background-image:url('${escapeAttribute(latestBlog.image)}')">
                </div>

                <div class="latest-explorer-content">

                    <span class="blog-category">
                        Ford Explorer
                    </span>

                    <h3>
                        ${escapeHTML(latestBlog.title)}
                    </h3>

                    <div class="blog-date">
                        ${formatDate(latestBlog.date)}
                    </div>

                    <div class="blog-excerpt">
                        ${createExcerpt(latestBlog.description, 300)}
                    </div>

                    <a
                        class="blog-button"
                        href="${escapeAttribute(latestBlog.url)}">

                        Read the Latest Explorer Blog

                    </a>

                </div>

            </section>

        `;

        /*
         * Recent blogs section
         */

        html += `

            <section class="recent-explorer-section">

                <div class="recent-explorer-title">

                    <h3>
                        More Ford Explorer Articles
                    </h3>

                </div>

                <div class="recent-explorer-blogs">

        `;

        recentBlogs.forEach((blog) => {
          html += `

                <article class="explorer-blog-card">

                    <div
                        class="explorer-card-image"
                        style="background-image:url('${escapeAttribute(blog.image)}')">
                    </div>

                    <div class="explorer-card-content">

                        <span class="blog-category">
                            Ford Explorer
                        </span>

                        <h4>
                            ${escapeHTML(blog.title)}
                        </h4>

                        <div class="blog-date">
                            ${formatDate(blog.date)}
                        </div>

                        <p>
                            ${createExcerpt(blog.description, 150)}
                        </p>

                        <a
                            class="blog-button"
                            href="${escapeAttribute(blog.url)}">

                            Read More

                        </a>

                    </div>

                </article>

            `;
        });

        html += `

                </div>

            </section>

        `;

        container.innerHTML = html;
      }

      /*
       * ---------------------------------------------------------
       * FORMAT DATE
       * ---------------------------------------------------------
       */

      function formatDate(date) {
        if (!date) {
          return "";
        }

        const parsedDate = new Date(date);

        if (isNaN(parsedDate)) {
          return date;
        }

        return parsedDate.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      /*
       * ---------------------------------------------------------
       * CREATE EXCERPT
       * ---------------------------------------------------------
       */

      function createExcerpt(text, length) {
        if (!text) {
          return "";
        }

        text = text.replace(/\s+/g, " ").trim();

        if (text.length <= length) {
          return text;
        }

        return text.substring(0, length).trim() + "...";
      }

      /*
       * ---------------------------------------------------------
       * SECURITY HELPERS
       * ---------------------------------------------------------
       */

      function escapeHTML(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHTML(value);
      }

      /*
       * ---------------------------------------------------------
       * START
       * ---------------------------------------------------------
       */

      document.addEventListener("DOMContentLoaded", loadExplorerBlogs);
    </script>
  </body>
</html>
